name: CI

on:
  push:
  pull_request:

jobs:
  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every pushed commit that changes src/ or eval/ updates docs/STATUS.md
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/check_status_updated.sh --commits "$BEFORE..$SHA"
          else
            scripts/check_status_updated.sh --commits -1 "$SHA"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests eval
      - run: ruff format --check src tests eval
      - run: pytest

  stack:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENALEX_EMAIL: ci@example.invalid
      OLLAMA_BASE_URL: http://localhost:11434/v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - run: docker compose up -d db backend
      - name: Wait for GET /health
        run: curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/health
      - if: failure()
        run: docker compose logs migrate backend db
